[project]
name = "cloakbrowser-manager-jac"

[npm.web]
name = "cloakbrowser-manager"
private = true
version = "0.1.0"
type = "module"

[npm.web.scripts]
dev = "vite"
build = "tsc -b && vite build"
preview = "vite preview"
test = "vitest run"
"test:watch" = "vitest"

[npm.web.dependencies]
"@dnd-kit/core" = "^6.3.1"
"@dnd-kit/sortable" = "^10.0.0"
"@dnd-kit/utilities" = "^3.2.2"
"@novnc/novnc" = "^1.7.0"
lucide-react = "^1.71.0"
react = "^19.3.1"
react-dom = "^19.3.1"
"react-router-dom" = "^7.6.0"

[npm.web.devDependencies]
"@tailwindcss/postcss" = "^4.3.5"
"@testing-library/jest-dom" = "^7.0.1"
"@testing-library/react" = "^16.3.3"
"@types/react" = "^19.3.0"
"@types/react-dom" = "^19.3.0"
"@vitejs/plugin-react" = "^5.0.0"
autoprefixer = "^10.6.2"
jsdom = "^31.0.0"
postcss = "^8.5.32"
tailwindcss = "^4.3.4"
typescript = "~7.0.2"
vite = "^7.1.0"
vitest = "^5.1.0"

[check.lint]
select = ["style"]

[plugins]
token_auth = { path = "token_auth" }

[auth]
plugin = "token_auth"
